  <header class="topbar">

      <div class="logo">🗾</div>

          <span id="todayPill" class="pill today" hidden>Today</span>
        </div>
        <div class="subtitle">Flip through days · Quick jump · Search · Offline</div>
      </div>
    </div>

    <div class="controls" aria-label="Controls">
      <div class="searchWrap" role="search">
        <span class="searchIcon">🔎</span>
        <input id="searchInput" class="search" type="search" placeholder="Search (USJ, Umeda, Asakusa)..." autocomplete="off" />
        <div class="searchBtns">
          <button id="prevMatch" class="iconBtn" aria-label="Previous match" title="Previous match">↑</button>
          <button id="nextMatch" class="iconBtn" aria-label="Next match" title="Next match">↓</button>
          <button id="clearSearch" class="iconBtn" aria-label="Clear search" title="Clear">✕</button>
        </div>
      </div>

      <div class="dateWrap" title="Pretend today is a different date (planning mode)">
        <span class="dateIcon">📅</span>
        <input id="mockDate" class="dateInput" type="date" />
        <button id="useRealToday" class="iconBtn" aria-label="Use real today" title="Use real today">↺</button>
      </div>

      <div class="navWrap" aria-label="Navigation">
        <button id="themeBtn" class="btn" aria-label="Toggle dark/light" title="Toggle dark/light">🌙</button>
        <button id="prevBtn" class="btn" aria-label="Previous page">◀</button>
        <select id="jumpSelect" class="select" aria-label="Quick jump to day"></select>
        <button id="nextBtn" class="btn" aria-label="Next page">▶</button>
      </div>
    </div>
  </header>

  <main class="stage">
    <div class="hint" id="hint">Tip: Swipe left/right on the page to flip. Scroll inside the day to see all rows.</div>
    <div class="book" id="book" aria-label="Itinerary flipbook"></div>

    <div class="footer">
      <div class="pager">
        <span id="pageLabel"></span>
        <span id="searchLabel" class="searchLabel" hidden></span>
      </div>
      <button id="printBtn" class="btn secondary">Print current day</button>
    </div>
  </main>
